<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Código Bitacora</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: #334155;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 18px 30px rgba(15, 23, 42, 0.35);
      }

      .card-header {
        background: var(--panel-2);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
        font-weight: 700;
      }

      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: #0b1120;
        color: #dbeafe;
        font-size: 0.9rem;
        line-height: 1.5;
        min-height: 260px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Código de Bitacora</h1>
      <div class="grid">
        <section class="card">
          <div class="card-header">index.html</div>
          <pre id="html-code"></pre>
        </section>

        <section class="card">
          <div class="card-header">styles.css</div>
          <pre id="css-code"></pre>
        </section>

        <section class="card">
          <div class="card-header">script.js</div>
          <pre id="js-code"></pre>
        </section>
      </div>
    </div>

    <script>
      async function loadFile(path, targetId) {
        const response = await fetch(path);
        const text = await response.text();
        document.getElementById(targetId).textContent = text;
      }

      loadFile('index.html', 'html-code');
      loadFile('styles.css', 'css-code');
      loadFile('script.js', 'js-code');
    </script>
  </body>
</html>
